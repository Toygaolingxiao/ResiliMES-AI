<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>イベントログの取り込み</title>
    <link rel="stylesheet" href="/assets/design/tokens.css?v=1" />
    <link rel="stylesheet" href="/assets/product/report/report.css?v=3" />
  </head>
  <body>
    <header class="bar">
      <nav class="product-nav" aria-label="product">
        <a class="back" href="/">ResiliMES</a>
        <a href="/timeline" data-nav="timeline"></a>
        <a href="/report" data-nav="report"></a>
        <a href="/import" data-nav="import" aria-current="page"></a>
        <h1 id="title">イベントログの取り込み</h1>
      </nav>
      <div class="langs" role="group">
        <button type="button" data-lang="ja">日本語</button>
        <button type="button" data-lang="zh">中文</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </header>
    <p id="lead" class="lead"></p>
    <p id="format" class="note"></p>
    <form id="form" class="pick">
        <label><span id="file-label"></span> <input id="file" type="file" accept=".csv,.json,.jsonl,text/csv,application/json"></label>
        <button id="submit" type="submit"></button>
      </form>
    <article class="sheet">
      <p id="status" class="status" role="status"></p>
      <div id="result" hidden></div>
      <div id="contents" hidden></div>
    </article>
    <script src="/assets/product/import/import.js?v=4"></script>
  </body>
</html>
