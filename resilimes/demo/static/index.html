<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='2' fill='%234338ca'/%3E%3Crect x='3' y='3' width='3' height='10' rx='1' fill='%23fff'/%3E%3Crect x='7' y='6' width='3' height='7' rx='1' fill='%23e0e7ff'/%3E%3Crect x='11' y='9' width='2' height='4' rx='1' fill='%23c7d2fe'/%3E%3C/svg%3E" />
    <title>ResiliMES — recovery</title>
    <script>
      try {
        if (localStorage.getItem("resilimes.theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <h1>ResiliMES</h1>
          <p id="tagline" class="tagline"></p>
          <button type="button" id="version" class="chip"></button>
        </div>
        <div class="top-meta">
          <p id="clock" class="clock"></p>
          <button type="button" id="theme" class="theme"></button>
          <div class="langs" role="group" aria-labelledby="lang-label">
            <span id="lang-label" class="lang-label"></span>
            <button type="button" data-lang="en">English</button>
            <button type="button" data-lang="zh">中文</button>
            <button type="button" data-lang="ja">日本語</button>
          </div>
          <span id="mode-badge" class="badge"></span>
          <span id="mode-detail" class="mode-detail"></span>
        </div>
      </header>
      <p id="banner" class="banner" hidden></p>
      <nav id="tabs" class="tabs" role="tablist"></nav>
      <main class="layout">
        <aside class="rail">
          <h2 id="disruption-label"></h2>
          <div id="scenarios" class="scenario-list"></div>
          <h2 id="tools-label"></h2>
          <ul id="bay-legend" class="bay-legend"></ul>
          <ul id="tools" class="bay"></ul>
          <h2 id="materials-label"></h2>
          <ul id="materials" class="bay"></ul>
          <details class="custom-wrap">
            <summary id="describe-label"></summary>
            <textarea id="incident" rows="2"></textarea>
            <button id="run-custom" class="run" type="button"></button>
          </details>
          <p id="status" class="status" role="status"></p>
        </aside>
        <section class="workspace">
          <div id="panel-recover" class="panel" role="tabpanel">
            <div id="empty" class="overview">
              <p id="product-line" class="product-line"></p>
              <div id="shift-kpis" class="shift-kpis"></div>
              <article class="plan-card">
                <header>
                  <h3 id="plan-label"></h3>
                  <ul id="plan-legend" class="bay-legend"></ul>
                </header>
                <div id="gantt-now"></div>
              </article>
              <div id="recommend" class="recommend"></div>
            </div>
            <div id="story" hidden>
              <h2 id="headline"></h2>
              <p id="refusal"></p>
            </div>
            <div id="cards" class="cards" hidden></div>
            <div id="stepper" class="stepper" hidden></div>
            <div id="result" hidden>
              <div class="chart-tools">
                <p id="optimality" class="opt-badge" hidden></p>
                <div id="views" class="views" role="group"></div>
              </div>
              <div class="charts">
                <article>
                  <header><h3 id="before-label"></h3></header>
                  <div id="gantt-before"></div>
                </article>
                <article>
                  <header><h3 id="after-label"></h3></header>
                  <div id="gantt-after"></div>
                </article>
              </div>
              <ul id="legend" class="legend"></ul>
            </div>
          </div>
          <div id="panel-analyze" class="panel scroll" role="tabpanel" hidden></div>
          <div id="panel-verify" class="panel scroll" role="tabpanel" hidden></div>
        </section>
      </main>
    </div>
    <div id="note" class="note" hidden></div>
    <div id="tip" class="tip" hidden></div>
    <div id="route" class="route" hidden></div>
    <script src="/assets/app.js"></script>
  </body>
</html>
