[project]
name = "resilimes"
version = "1.0.0"
description = "Autonomous multi-agent rescheduling and fault recovery for smart manufacturing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ResiliMES" }]
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]

[project.scripts]
resilimes = "resilimes.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["resilimes", "agent", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"resilimes/agents/brief.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["resilimes", "agent"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
packages = ["resilimes", "agent"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openai.*", "dotenv.*", "requests.*", "uvicorn.*"]
ignore_missing_imports = true
