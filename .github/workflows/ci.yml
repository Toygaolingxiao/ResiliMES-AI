name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Typecheck
        run: python -m mypy
      - name: Explain boundary
        run: python -m pytest -q tests/test_explain_boundary.py tests/test_explain_contract.py
      - name: Test
        run: python -m pytest
      - name: Offline smoke
        run: python smoke_test.py --mock
        env:
          RESILIMES_MODE: mock

  explain-alone:
    # The explain layer installed on its own, without the rest of the repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install explain only
        run: python -m pip install ./packages/resilimes-explain pytest
      - name: Test explain only
        working-directory: packages/resilimes-explain
        run: |
          python -c "import resilimes.explain, sys; assert 'site-packages' in resilimes.explain.__file__, resilimes.explain.__file__"
          python -m pytest
