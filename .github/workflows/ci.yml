name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same ref supersedes runs still in flight:
# cancel them instead of letting them queue ahead of the current head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Typecheck
        run: python -m mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      # Recorded (qtime-r2) path. Mode is set here — not in conftest — so the
      # product default stays plan when the env is unset. Plan coverage on
      # PRs: test_sched_mode.py + test_plan_kpi_baseline (kpi-baseline job).
      - name: Test
        run: python -m pytest -m 'not kpi_baseline'
        env:
          RESILIMES_SCHED_MODE: strict_qtime
      - name: Offline smoke
        run: python smoke_test.py --mock
        env:
          RESILIMES_MODE: mock

  # Ambient plan-mode full pass: every push to main (post-merge), not every
  # PR push. PRs cover plan via test_sched_mode.py and the kpi-baseline job.
  plan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test (plan)
        run: python -m pytest -m 'not kpi_baseline'
        env:
          RESILIMES_SCHED_MODE: plan

  # F0 of epic #137: lock HARD_QTIME.md plan+hard KPIs (seeds 1–3, 7 d).
  # ~4 min wall with 3 workers; excluded from the default suite via -m.
  kpi-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Plan-mode KPI baseline
        run: python -m pytest -m kpi_baseline
        # Product default: leave RESILIMES_SCHED_MODE unset so the test
        # asserts ambient plan.

  explain-alone:
    # The explain layer installed on its own, without the rest of the repository.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install explain only
        run: python -m pip install ./packages/resilimes-explain pytest
      - name: Test explain only
        working-directory: packages/resilimes-explain
        run: |
          python -c "import resilimes.explain, sys; assert 'site-packages' in resilimes.explain.__file__, resilimes.explain.__file__"
          python -m pytest
